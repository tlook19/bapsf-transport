# g1atrim -- the LAPDSim1D stance of record.
#
# Stance   : g1atrim
# Adopted  : 2026-08-19
#
# This file is the ONE artifact that constructs the stance. It is the complete
# delta from ``default_config()``: every key below differs from its config
# default, except the three noted as resolved accretion (cathode_emission_profile,
# Te_birth_ionization, T_s), which equal the default and are stated explicitly
# because run_m6_point.py's own driver defaults do not. Applying these two
# tables on top of ``default_config()`` reproduces, key for key, the config the
# g1atrim arm of record ran.
#
# PROVENANCE IS NOT HERE. What each value is, how it was measured, derived,
# fitted or assumed, and what may be claimed from it live in
# scripts/production_stance_provenance.md. This file carries values and the
# functional notes needed to read them.
#
# input_dict and input_flags are SEPARATE namespaces and each rejects a key it
# does not own, so a key in the wrong table raises at construction rather than
# going silently inert. The loader (scripts/stance_config.py) checks both tables
# against the config templates before anything is constructed.
#
# TOML has no null literal: keys whose stance value is None are named in
# [none_valued] instead of appearing in the tables above.
#
# Consumers: ``run_m6_point.py --stance g1atrim`` (base config; --extra layers
# on top and says so), ``preflight_diffcfg.py --stance g1atrim`` (reference
# side of a config diff), and ``compare_sim1d_es1.PARAM_OVERRIDES`` (the shared
# driver values it carries are read from here, so they live in one place).


[input_dict]

