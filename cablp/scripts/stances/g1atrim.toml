# CATHODE AND CIRCUIT.
C_R = 7.09
V_bank = 177.843
cathode_conduction_W_per_K = 12058.0
cathode_heat_capacity_J_per_K = 181.0
cathode_emission_profile = "uniform"
T_s = 1998.15

# FUELING.
S_gp = 9010.0
S_gp_decay_target = 2000
equilibration_gas_puff_on_s = 0.025

# BEAM DEPOSITION, ANOMALOUS HEATING, AND THE HEAT-FLUX LIMITER.
b_beam_excitation = 1.4
beam_deposition_smoothing_cm = 50.0
heating_anomalous_transport = "tail_walk"
heating_anomalous_tail_ionization = "on"
heat_flux_limiter_f = 0.1
Te_birth_ionization = "local"

# RUN COST. Not physics: the afterglow tail length and the max-steps
# action the arm of record carried.
tau_afterglow = 0.006
max_steps_action = "stop"

[input_flags]

# NEUTRAL CLOSURE. Two-zone particles, neutral momentum and energy and the hot
# internal wall are config defaults since the R2a fold-in and are no longer
# named here. What remains is the shaped initial profile (which is why
# neutral_equilibration is OFF -- the equilibrated seed would overwrite the
# profile, and the solver refuses the pair); the profile flag stays stance-side
# because the per-cell nn0_profile it requires is sized to this mesh.
neutral_initial_profile = true
neutral_equilibration = false

# GEOMETRY: the per-cell prescribed areas and the baffles that go with the
# measured machine, plus the fixed-cell source region.
prescribed_area_geometry = true
neutral_baffles = true
source_fixed_grid = true

# TRANSPORT.
electron_heat_flux_limit = true

# Keys whose stance value is None (TOML has no null literal).
[none_valued]
input_dict = ["nn0"]
input_flags = []
