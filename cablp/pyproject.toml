[project]
name = "cablp"
version = "0.0.1a"
description = "0D and Pseudo-1D transport simulation for LAPD"
authors = [
    {name = "Tom",email = "tlook@physics.ucla.edu"}
]
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "mpmath (>=1.4.0,<2.0.0)",
    "scipy (>=1.0.0)"
]

[build-system]
# Cython and setuptools are BUILD-time only: they compile the optional
# cablp.funcs._cathode_kernels_cy extension (D4 spike). The runtime never
# needs them -- the compiled kernels are opt-in via CABLP_COMPILED_KERNELS and
# the default path is pure Python whether or not the extension was built.
#
# scipy is BOTH a runtime dependency and a build requirement, and it must be
# listed here as well: the .pyx does
# `from scipy.optimize.cython_optimize cimport brentq, zeros_full_output`,
# and Cython resolves that against scipy/optimize/cython_optimize.pxd on
# sys.path. A PEP 517 isolated build env contains ONLY the packages named
# here, so without scipy the cimport cannot resolve; >=1.3 is the release that
# introduced the cimport-able cython_optimize module. numpy is deliberately
# NOT a build requirement -- the .pyx imports it at Python level only and
# cimports nothing from it, so no numpy headers are needed to compile.
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "Cython>=3.0",
    "setuptools>=68",
    "scipy>=1.3",
]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
name = "cablp"
packages = [{include = "cablp"}]
# The compiled extension is gitignored (derived, machine-specific), and
# poetry honours VCS ignores when collecting `packages`, so the built .so
# must be named explicitly or it is silently left out of the wheel -- giving
# a platform-tagged wheel with no extension in it. Wheel only: an sdist
# ships the .pyx and rebuilds.
include = [{ path = "cablp/funcs/*.so", format = "wheel" }]

[tool.poetry.build]
script = "build_ext.py"
generate-setup-file = false

