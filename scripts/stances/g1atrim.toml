# mesh face into the cathode and gap cells at the transparency this
# configuration states. Because the measure is volume, a source uniform per
# unit volume adds a density continuous across a bore step; the legacy matrix
# kernels, which weight by cell LENGTH, step it by the area ratio there.
# dt_foot is MEASURED, not chosen: the machine's circuit-on -> 1 kA lead at
# the ES1 rung (5.95 ms) minus the model's own circuit-on -> 1 kA time at that
