# CATHODE AND CIRCUIT.
# C_R re-trimmed 2026-09-01 (8.76 -> 9.30), the ONE knob turned to restore the
# drive under the KINETIC neutral closure adopted below, and PROMOTED from an
# arm override to the stance value at the kinetic stance event (2026-09-02).
# The kinetic neutral inventory loads the discharge differently, so the fluid
# closure's 8.76 came in 5.5% under the drive band on the DVM; the trim was a
# two-point secant in ln(plateau) against ln(C_R) measured on the DVM itself,
# solved for a plateau ratio of 1.000 against the measured band. The preceding
# value 8.76 was the same one-knob trim done for the plateau_multigroup
# anomalous-heating closure (2026-08-25, a three-point scan and a log-log fit).
# It is still the ONE drive-side fit knob: cathode_Ts_base_K is NOT co-trimmed
# and stays at the measured config default 1910.0, because the two are the same
# flat direction and only one member of a flat pair may carry a calibration.
# See production_stance_provenance.md.
C_R = 9.3
# V_bank is DELETED from this stance (2026-08-25; the 23b R4 deletion, executed
# for this half only). It was never a stance decision: V_bank is a PER-RUNG
# measurement owned by run_mechanism_ladder.ES_OPERATING (ES1 = 177.843, exactly
# the number this file used to repeat), so naming it here duplicated the rung
# and could only go stale against it. Campaign scores are unaffected -- every
# campaign arm takes V_bank from its rung, which is why deleting the row is
# invisible in a pre-flight against a campaign artifact. The golden takes no
# rung, so ITS V_bank falls back to the config default 180.0, and the authorized
# recapture that accompanies this edit absorbs that move.
cathode_conduction_W_per_K = 12058.0
cathode_heat_capacity_J_per_K = 181.0
cathode_emission_profile = "uniform"
# T_s was the OTHER half of the 23b R4 deletion, deferred three times and now
# RESOLVED BY RETIREMENT (2026-09-03): the key no longer exists, so this row
# is gone with it and naming it again is refused at construction. The
# cathode's surface temperature is cathode_Ts_base_K -- the standby the
# static warming model holds the surface at and power_balance evolves from --
# which this stance leaves at its config default 1910.0 for the reason given
# under C_R above. This stance runs power_balance, under which the retired
# row was already inert, so removing it rotates the resolved CONFIG IDENTITY
# by exactly one key and moves no value. See
# scripts/gates/golden_baseline_provenance.md.

# FUELING. The puff window that arms with the equilibrate route is a member of
# [models.initial_neutral_state] and is stated there.
S_gp = 9010.0
# INJECTION ROW. The puff is placed by the tube-beamed row derived from the CAD
# port geometry and the feed pipe behind it, not by the fluid cosine lobe: the
# in-solver puff, the equilibrated seed and the shaped foot below now share ONE
# shape at ONE geometry. The bore is the MIDPOINT of the ruled [3.8, 4.1] cm
# hardware bracket and the length is its one-sided lower bound; the two bracket
# endpoints move the derived fill by < 0.1 %, so the midpoint is the value and
# the endpoints stay the bracket. Both keys are refused under any other profile.
gas_puff_profile = "orifice"
gas_puff_orifice_id_cm = 3.95
gas_puff_orifice_length_cm = 22.0

# KINETIC NEUTRAL CLOSURE -- the DVM engine's own controls. The closure
# SELECTION and the thirteen keys it forces are [models.neutral_closure]
# below; the keys here belong to no family and are therefore stated flat.
#
# VELOCITY MESH AND NEUTRAL CLOCK. Numerical choices, not physics. The kinetic
# state advances on its own clock rather than on the plasma step, and between
# ticks the plasma consumes a zero-order hold of it -- a Lie-type splitting
# whose error is first order in the cadence by construction. 64 x 24 velocity
# nodes at a 3.125 us tick is the resolution the production program ran and
# gated; the package defaults (48 x 12 at 25 us) are the cheap development
# setting and their own docstring calls the cadence provisional. nvz must be
# EVEN -- an odd count places a node at exactly v_z = 0, which neither
# transports nor mirrors.
neutral_kinetic_dvm_nvz = 64
neutral_kinetic_dvm_nvp = 24
neutral_kinetic_dvm_cadence_s = 3.125e-6

# WALL INTERACTION. Both keys equal their config default and are stated anyway,
# as class-1 declarations: the closure IS this pair of choices, and a stance
# that ran them by silence would not read as having made them.
# neutral_kinetic_dvm_accommodation is the thermal accommodation coefficient
# alpha_E of the room-temperature technical-metal surfaces, read at the
# cylinder and the end plates only (the anode mesh and the interior closed
# faces are fully accommodating by construction and do not read it). Under the
# Maxwell specular-diffuse kernel the diffuse fraction IS alpha_E exactly.
# neutral_kinetic_dvm_wall_reflection chooses the spectrum the remaining
# (1 - alpha_E) share leaves the CYLINDER on: "diffuse_elastic" returns the
# same count on a cosine spectrum whose temperature is solved so the discrete
# mean energy equals the retained share's own incident mean, so the surface
# randomizes direction while exchanging no energy and returning no net axial
# momentum. See production_stance_provenance.md for the bracket alpha_E sits in.
neutral_kinetic_dvm_accommodation = 0.40
neutral_kinetic_dvm_wall_reflection = "diffuse_elastic"

# THE DVM'S OWN DIRECTED-RECYCLE JETS, armed at both electrode faces. They are
# the kinetic closure's form of the channels the FLUID cathode_neutral_jet and
# anode_neutral_jet carried: that pair is evolved-M_n momentum physics, which
# the neutral_closure block below turns off because the DVM owns the neutral
# first moment, while these split the counted recycle into an energetic
# backscatter share born directly into f and a thermal remainder. Their R_N/R_E
# pairs are config defaults, the same surface numbers the fluid pair used, and
# are not restated here.
neutral_kinetic_dvm_cathode_jet = true
neutral_kinetic_dvm_anode_jet = true
# The CATHODE jets -- both the fluid and the DVM channel, from one latch -- are
# current-ARMED with hysteresis: the latch arms on the first accepted step
# whose cathode solve books an ion current at or above the arming threshold and
# releases only when a step falls below the disarming one, so the jets act over
# the conducting phase and cannot chatter at the crossing. While disarmed
# nothing is launched AND the cathode surface is not debited for it. The ANODE
# jet is not covered: it is driven by the anode-collected current.
neutral_jet_arm_current_A = 50.0
neutral_jet_disarm_current_A = 25.0

# IONIZATION BIRTH TEMPERATURES. Neither key belongs to a declared family.
Te_birth_ionization = "local"
# Class-1 declaration: physics-bearing, so it is stated here even though it
# equals the config default. The ion is born at the local neutral temperature,
# the conserving partner of the En ionization sink.
Ti_birth_ionization = "neutral"

# RUN COST. Not physics: the afterglow tail length and the max-steps
# action the arm of record carried.
tau_afterglow = 0.006
max_steps_action = "stop"


[input_flags]

# CORRECTED ANODE SHEATH BOOKING. Armed 2026-08-25. The plasma electron store
# is debited (2 Te + phi_a) per electron the anode collects -- the sheath-edge
# energy flux of the truncated Maxwellian the sheath solve already closes on --
# instead of the plasma-thermal 2 Te alone, and the anode mesh's Bohm
# collection rows are re-cut to their sheath-edge values in the same arming.
# The circuit ledger is untouched: the phi_a those electrons pay is field energy
# the loop and the anode ions already book. The electron-ATTRACTING regime
# (phi_a <= 0) keeps the unarmed thermal-only booking, because there the bank
# pays the fall, and it is COUNTED rather than silent. It is a booking
# correction, not a calibration. Requires characteristic_boundary, which this
# stance takes from the config defaults.
anode_sheath_full_debit = true

# OPERATOR HOME OF THE BEAM'S ELECTRON-ENERGY DEPOSITION. Armed 2026-08-25. The
# beam_power_deposition Ee row leaves the explicit operator A and is applied by
# the implicit heat substep B, held constant over each substep and solved with
# the tridiagonal conduction operator. Nothing else about the beam moves: the
# ionization births, the ionization cost and the excitation radiation are
# reaction-channel terms and stay in A. This is the class-1 fix for the staged
# Te bias -- depositing beam power explicitly and then conducting it implicitly
# let the deposition cell run hot across the substep boundary.
beam_deposition_in_heat_substep = true

# NEUTRAL CLOSURE. The three closure flags this stance turns -- neutral
# momentum, neutral energy and the hot internal wall, all config defaults ON
# since the R2a fold-in -- are members of the neutral_closure family and are
# stated in [models.neutral_closure] below, not here.
#
# neutral_two_zone is NOT a member: it is a PREREQUISITE of the kinetic
# closure, which the solver requires rather than resolves, so it is stated
# flat. It equals the config default and is written anyway, as a class-1
# declaration: the DVM carries column AND annulus, and the campaign driver's
# --two-zone flag sets nothing this row does not already say.
neutral_two_zone = true

# The baffles act on the DVM annulus as well as on the fluid neutral field:
# the annulus flux crossing each baffle face is intercepted in the blocked
# fraction of the face area and re-emitted at the wall temperature in the cell
# it came from, particle-conserving. It adds no coefficient -- the clear radius
# is the measured CAD value already named in [input_dict] -- and it requires
# the neutral_baffles flag and its two arrays, which follow.
neutral_kinetic_dvm_baffles = true

# GEOMETRY: the per-cell prescribed areas and the baffles that go with the
# measured machine. Both stay stance-side because the arrays they require are
# sized to this mesh; source_fixed_grid folded into the config defaults.
prescribed_area_geometry = true
neutral_baffles = true


