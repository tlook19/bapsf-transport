cathode_conduction_W_per_K = 12058.0
cathode_heat_capacity_J_per_K = 181.0
cathode_emission_profile = "uniform"
# T_s was the OTHER half of the 23b R4 deletion, deferred three times and now
# RESOLVED BY RETIREMENT (2026-09-03): the key no longer exists, so this row
# is gone with it and naming it again is refused at construction. The
# cathode's surface temperature is cathode_Ts_base_K -- the standby the
