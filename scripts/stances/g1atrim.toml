# the coefficient at R2b).
beam_deposition_model = "csda"
beam_coulomb_model = "fast_electron"
beam_anomalous_model = "quasilinear"
ql_relaxation_coeff = 30.0
beam_product_transport = "local"

# ANOMALOUS-HEATING TRANSPORT. Adopted 2026-08-25 (tail_walk ->
# plateau_multigroup): the quasilinear plateau is carried as a SPECTRUM rather
# than as the single tail line the two predecessor arms each represented, and
# the two single-line arms are its two heirs taken one at a time. Nothing is
# fitted -- the wave/bulk and streaming shares, the group edges and the group
# weights all follow from the flat plateau and the state-solved plateau edge
# E_1 -- which is why the tail-energy dial, the fixed rung and the keying
# selector are INERT under it and are refused at construction rather than
# ignored. Their DEFAULTS are accepted, which is why the block states each of
# them at its default rather than at a value this closure would refuse.
heating_anomalous_transport = "plateau_multigroup"
heating_anomalous_disposal = "local"
heating_anomalous_tail_energy_eV = 75.0

# Tail ionization rides the selector unchanged: it is one of the tail_walk
# conventions plateau_multigroup inherits, and it applies to the walked
# streaming groups exactly as it applied to the single tail line.
heating_anomalous_tail_ionization = "on"
heating_anomalous_tail_energy_keying = "phi_c"
heating_anomalous_tail_cathode_boundary = "reflect"
beam_tail_anode_reflected_particles = 0.0
beam_tail_anode_reflected_energy = 0.0
beam_clump_fraction = 0.0
beam_clump_enhancement = 1.0
beam_deposition_smoothing_cm = 50.0
b_beam_excitation = 1.4
beam_excitation_model = "2p_scalar"
beam_excitation_energy_eV = 21.218
beam_anode_interception = true
beam_tail_anode_interception = false

# The f dial is undeclared: plateau_multigroup runs the birth spectrum from the
# derived plateau edge E_1 up to e*phi_c, and a stated fraction is refused.
none_valued = ["heating_anomalous_tail_phi_c_fraction"]


[models.neutral_closure]

# THE CLOSURE OF RECORD, adopted 2026-09-02. The neutral field is carried by
# the transient discrete-velocity model: a distribution f(z, v_z, v_perp) on
# the column and the annulus, advanced on its own clock, rather than by the
# two-moment fluid this stance ran until now. The selection is the first row;
# the other thirteen keys are what it FORCES, and they are written here at
# those required values rather than left to be resolved one refusal at a time.
#
# Everything below the selection says the same thing twice over: the DVM state
# OWNS the neutral first moment, so nothing else may carry a second copy of it
# or stand on one.
#
#   * neutral_momentum would evolve an M_n field that is already the first
#     moment of f;
#   * neutral_energy books the frictional half of the collisional exchange
#     against u - u_n, which has no meaning without that fluid wind, and the
#     hot internal wall and the hot birth drift are presence gates standing on
#     the hot channel neutral_energy creates;
#   * neutral_momentum_radial closes the RADIAL profile of the evolved wind,
#     so "uniform" is the only reading left;
#   * the four cathode-jet keys and the two anode-jet keys are M_n momentum
#     physics for the same reason. The recycle channels themselves are NOT
#     given up: the DVM's own cathode and anode jets carry them, armed in
#     [input_dict] above, and cathode_jet_energy_convention drops to "legacy"
#     because "total_reflected" rescales the FLUID jet's launch energy and
#     requires that fluid jet to exist;
#   * neutral_knudsen_temperature = "local" would scale the Knudsen
#     conductances by an evolved per-cell Tn, which only exists under
#     neutral_energy.
#
# The block therefore SUPERSEDES this file's former cathode_surface_recycle and
# anode_surface_recycle blocks: it claims seven of their eleven keys, and two
# blocks may not claim one key. The four it does not claim -- cathode_jet_R_N,
# cathode_jet_R_E, anode_jet_R_N, anode_jet_R_E -- are the fluid jets' surface
# pairs, inert with those jets off, and are left at their config defaults.
neutral_model = "kinetic_dvm"
neutral_momentum = false
neutral_energy = false
neutral_hot_internal_wall = false
neutral_hot_birth_drift = false
neutral_momentum_radial = "uniform"
neutral_knudsen_temperature = "frozen"
cathode_neutral_jet = false
cathode_jet_surface_debit = false
cathode_jet_energy_convention = "legacy"
cathode_jet_hot_carrier = false
anode_neutral_jet = false
neutral_mesh_accommodation = false

# The anode jet's energy convention is read against an anode jet that is off,
# and undeclared is the only value that stands without it.
none_valued = ["anode_jet_energy_convention"]


[models.initial_neutral_state]

# The equilibrate route is OFF and the profile route is armed: the equilibrated
# seed would overwrite the shaped foot, and the solver refuses the pair. The
# equilibration cycle count, its dt and the cached-seed modifier are config
# defaults, inert while the route is off, and are stated because a block is an
# inventory. equilibration_gas_puff_on_s is NOT inert -- the 25 ms puff window
# is a stance value the golden's own re-cut re-arms the route to use.
neutral_equilibration = false
launch_plasma_after_equilibration = true
neutral_equilibration_cycles = 100
neutral_equilibration_dt = 0.01
equilibration_gas_puff_on_s = 0.025
use_cached_neutral_seed = false

