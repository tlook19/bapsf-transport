# FUELING. The puff window that arms with the equilibrate route is a member of
# [models.initial_neutral_state] and is stated there.
S_gp = 9010.0
# INJECTION ROW. The puff is placed by the tube-beamed row derived from the CAD
# port geometry and the feed pipe behind it, not by the fluid cosine lobe: the
# in-solver puff, the equilibrated seed and the shaped foot below now share ONE
# shape at ONE geometry. The bore is the MIDPOINT of the ruled [3.8, 4.1] cm
# hardware bracket and the length is its one-sided lower bound; the two bracket
# endpoints move the derived fill by < 0.1 %, so the midpoint is the value and
# the endpoints stay the bracket. Both keys are refused under any other profile.
gas_puff_profile = "orifice"
gas_puff_orifice_id_cm = 3.95
gas_puff_orifice_length_cm = 22.0

# KINETIC NEUTRAL CLOSURE -- the DVM engine's own controls. The closure
# SELECTION and the thirteen keys it forces are [models.neutral_closure]
# below; the keys here belong to no family and are therefore stated flat.
#
# VELOCITY MESH AND NEUTRAL CLOCK. Numerical choices, not physics. The kinetic
# state advances on its own clock rather than on the plasma step, and between
# ticks the plasma consumes a zero-order hold of it -- a Lie-type splitting
# whose error is first order in the cadence by construction. 128 x 36 velocity
# nodes at a 3.125 us tick is the resolution the production program runs and
# gates; the package defaults (48 x 12 at 25 us) are the cheap development
# setting and their own docstring calls the cadence provisional. nvz must be
# EVEN -- an odd count places a node at exactly v_z = 0, which neither
# transports nor mirrors.
neutral_kinetic_dvm_nvz = 128
neutral_kinetic_dvm_nvp = 36
neutral_kinetic_dvm_cadence_s = 3.125e-6

# SURFACE-JET LAUNCH WIDTH. One dimensionless width shared by every armed
# surface jet, tying each launch spectrum's smear to the launch ENERGY instead
# of to the velocity grid: T_launch = max(beta * e_launch, grid width), where
# the grid width is the axial bin containing the launch speed expressed as a
# temperature and remains a FLOOR, because a smear narrower than the local bin
# collapses onto one bin and cannot be projected. The fractional energy width a
# launch is spread over is therefore (3/2) beta at every launch energy and
# every velocity resolution wherever beta clears that floor, rather than a
# quantity that halves with each doubling of nvz. Unset, each jet stays on the
# grid-tied width alone. It is not a gas temperature -- the launch spectrum's
# drift is solved from the energy, so the discrete mean energy is the launch
# energy whatever this is. Must lie in (0, 2/3); it is refused with every
# surface jet off and refused alongside any per-jet _T_launch_eV. Each armed
# tick reports how often the floor bound, in the engine's per-tick ledger.
neutral_kinetic_dvm_jet_launch_width = 0.13

# WALL INTERACTION. Both keys equal their config default and are stated anyway,
# as class-1 declarations: the closure IS this pair of choices, and a stance
# that ran them by silence would not read as having made them.
# neutral_kinetic_dvm_accommodation is the thermal accommodation coefficient
# alpha_E of the room-temperature technical-metal surfaces, read at the
# cylinder and the end plates only (the anode mesh and the interior closed
# faces are fully accommodating by construction and do not read it). Under the
# Maxwell specular-diffuse kernel the diffuse fraction IS alpha_E exactly.
# neutral_kinetic_dvm_wall_reflection chooses the spectrum the remaining
# (1 - alpha_E) share leaves the CYLINDER on: "diffuse_elastic" returns the
# same count on a cosine spectrum whose temperature is solved so the discrete
# mean energy equals the retained share's own incident mean, so the surface
# randomizes direction while exchanging no energy and returning no net axial
# momentum. The shipped 0.40 sits inside a declared bracket rather than being
# a pinned number, so a result states the arm it ran.
neutral_kinetic_dvm_accommodation = 0.40
neutral_kinetic_dvm_wall_reflection = "diffuse_elastic"

# THE DVM'S OWN DIRECTED-RECYCLE JETS, armed at both electrode faces. They are
# the kinetic closure's form of the channels the FLUID cathode_neutral_jet and
# anode_neutral_jet carried: that pair is evolved-M_n momentum physics, which
# the neutral_closure block below turns off because the DVM owns the neutral
# first moment, while these split the counted recycle into an energetic
# backscatter share born directly into f and a thermal remainder. Their R_N/R_E
# pairs are config defaults, the same surface numbers the fluid pair used, and
# are not restated here.
neutral_kinetic_dvm_cathode_jet = true
neutral_kinetic_dvm_anode_jet = true
# The CATHODE jets -- both the fluid and the DVM channel, from one latch -- are
# current-ARMED with hysteresis: the latch arms on the first accepted step
# whose cathode solve books an ion current at or above the arming threshold and
# releases only when a step falls below the disarming one, so the jets act over
# the conducting phase and cannot chatter at the crossing. While disarmed
# nothing is launched AND the cathode surface is not debited for it. The ANODE
# jet is not covered: it is driven by the anode-collected current.
neutral_jet_arm_current_A = 50.0
neutral_jet_disarm_current_A = 25.0

# IONIZATION BIRTH TEMPERATURES. Neither key belongs to a declared family.
Te_birth_ionization = "local"
# Class-1 declaration: physics-bearing, so it is stated here even though it
# equals the config default. The ion is born at the local neutral temperature,
# the conserving partner of the En ionization sink.
Ti_birth_ionization = "neutral"

# EXPLICIT ELECTRON-ION EXCHANGE, RATE-BOUNDED. The exchange sits in the
# explicit operator, and its other bound is a FRACTIONAL energy-change bound
# that vanishes as Te -> Ti -- so a cold dense column sitting at Te ~= Ti is
# bounded by nothing there while nu_eq is at its stiffest. This key adds the
# stability bound dt <= c / nu_eq,max. The difference Te - Ti relaxes at
# 2 nu_eq, so c = 0.5 puts the explicit SSPRK2 advance of that difference at
# z = -2 c = -1: inside the scheme's real-axis stability interval and still
# resolving the relaxation. It is the min with the fractional bound, so it can
# only tighten the step, and it names itself energy_exchange_rate in a run's
# dt census when it binds.
energy_exchange_rate_fraction = 0.5

# RUN COST. Not physics: the afterglow tail length and the max-steps
# action the arm of record carried.
tau_afterglow = 0.006
max_steps_action = "stop"


[input_flags]

# CORRECTED ANODE SHEATH BOOKING. Armed 2026-08-25. The plasma electron store
# is debited (2 Te + phi_a) per electron the anode collects -- the sheath-edge
# energy flux of the truncated Maxwellian the sheath solve already closes on --
# instead of the plasma-thermal 2 Te alone, and the anode mesh's Bohm
# collection rows are re-cut to their sheath-edge values in the same arming.
# The circuit ledger is untouched: the phi_a those electrons pay is field energy
# the loop and the anode ions already book. The electron-ATTRACTING regime
# (phi_a <= 0) keeps the unarmed thermal-only booking, because there the bank
# pays the fall, and it is COUNTED rather than silent. It is a booking
# correction, not a calibration. Requires characteristic_boundary, which this
# stance takes from the config defaults.
anode_sheath_full_debit = true

# END-WALL SHEATH ELECTRON-ENERGY BOOKING. The plasma electron store is
# debited, per electron the chamber's far end wall collects, the barrier those
# electrons climbed -- Lambda_eff Te, the floating-sheath lift for the
# configured gas plus the presheath drop implied by the same sheath-edge
# factor that face samples its Bohm flux at -- on top of the unconditional
# sheath-edge 2 Te, so the face debit is (2 + Lambda_eff) Te per collected
# electron. The end wall carries no circuit branch, so nothing but the
# electron thermal store can supply that fall; the ions carry it to the
# surface and the end wall surface-power diagnostic includes it. The row is
# ELECTRON ENERGY ONLY -- no particle, momentum or ion-thermal booking at the
# face moves -- and it is booked whenever plasma reaches the face, independent
# of the cathode circuit solve. It requires a
# plasma-absorbing face of the END WALL role, which this stance's geometry
# supplies. The emitting cathode face's own three rows are the separate
# cathode_face_full_debit key, which this stance leaves at its config default.
# The response is not local to the end cell: the column re-equilibrates as a
# whole through the far-end neutral field, so the port-level response to this
# booking is conditional on the kinetic neutral closure (kinetic_dvm).
end_wall_sheath_full_debit = true

# OPERATOR HOME OF THE BEAM'S ELECTRON-ENERGY DEPOSITION. Armed 2026-08-25. The
# beam_power_deposition Ee row leaves the explicit operator A and is applied by
# the implicit heat substep B, held constant over each substep and solved with
# the tridiagonal conduction operator. Nothing else about the beam moves: the
# ionization births, the ionization cost and the excitation radiation are
# reaction-channel terms and stay in A. This is the class-1 fix for the staged
# Te bias -- depositing beam power explicitly and then conducting it implicitly
# let the deposition cell run hot across the substep boundary.
beam_deposition_in_heat_substep = true

# NEUTRAL CLOSURE. The three closure flags this stance turns -- neutral
# momentum, neutral energy and the hot internal wall, all config defaults ON
# since the R2a fold-in -- are members of the neutral_closure family and are
# stated in [models.neutral_closure] below, not here.
#
# neutral_two_zone is NOT a member: it is a PREREQUISITE of the kinetic
# closure, which the solver requires rather than resolves, so it is stated
# flat. It equals the config default and is written anyway, as a class-1
# declaration: the DVM carries column AND annulus, and the campaign driver's
# --two-zone flag sets nothing this row does not already say.
neutral_two_zone = true

# The baffles act on the DVM annulus as well as on the fluid neutral field:
# the annulus flux crossing each baffle face is intercepted in the blocked
# fraction of the face area and re-emitted at the wall temperature in the cell
# it came from, particle-conserving. It adds no coefficient -- the clear radius
# is the measured CAD value already named in [input_dict] -- and it requires
# the neutral_baffles flag and its two arrays, which follow.
neutral_kinetic_dvm_baffles = true

# GEOMETRY: the per-cell prescribed areas and the baffles that go with the
# measured machine. Both stay stance-side because the arrays they require are
# sized to this mesh; source_fixed_grid folded into the config defaults.
prescribed_area_geometry = true
neutral_baffles = true


# ---------------------------------------------------------------------------
# DECLARATION BLOCKS. Each states one family's COMPLETE membership -- every
# member written, at its stance value where the stance turns it and at its
# config default where it does not. Namespaces are carried by the membership,
# not by the block. See cablp/solvers/_sim1d/CONFIG_DECLARATIONS.md.
# ---------------------------------------------------------------------------


[models.beam_tail_closure]

# The deposition, Coulomb and anomalous-channel selectors, the walked tail's
# conventions and the clump pair are all config defaults; they are written here
# because a block is an inventory of the whole closure, not a delta against
# defaults that may move. The heat-flux limiter is NOT a member of this family
# and is not named here: both the electron_heat_flux_limit flag and its
# coefficient heat_flux_limiter_f are config defaults (the flag folded at R2a,
# the coefficient at R2b).
beam_deposition_model = "csda"
beam_coulomb_model = "fast_electron"
beam_anomalous_model = "quasilinear"
ql_relaxation_coeff = 30.0
beam_product_transport = "local"

# ANOMALOUS-HEATING TRANSPORT. Adopted 2026-08-25 (tail_walk ->
# plateau_multigroup): the quasilinear plateau is carried as a SPECTRUM rather
# than as the single tail line the two predecessor arms each represented, and
# the two single-line arms are its two heirs taken one at a time. Nothing is
# fitted -- the wave/bulk and streaming shares, the group edges and the group
# weights all follow from the flat plateau and the state-solved plateau edge
# E_1 -- which is why the tail-energy dial, the fixed rung and the keying
# selector are INERT under it and are refused at construction rather than
# ignored. Their DEFAULTS are accepted, which is why the block states each of
# them at its default rather than at a value this closure would refuse.
heating_anomalous_transport = "plateau_multigroup"
heating_anomalous_disposal = "local"
heating_anomalous_tail_energy_eV = 75.0

# Tail ionization rides the selector unchanged: it is one of the tail_walk
# conventions plateau_multigroup inherits, and it applies to the walked
# streaming groups exactly as it applied to the single tail line.
heating_anomalous_tail_ionization = "on"
heating_anomalous_tail_energy_keying = "phi_c"
heating_anomalous_tail_cathode_boundary = "reflect"
beam_tail_anode_reflected_particles = 0.0
beam_tail_anode_reflected_energy = 0.0
beam_clump_fraction = 0.0
beam_clump_enhancement = 1.0
beam_deposition_smoothing_cm = 50.0
b_beam_excitation = 1.4
beam_excitation_model = "2p_scalar"
beam_excitation_energy_eV = 21.218
beam_anode_interception = true
beam_tail_anode_interception = false

# The f dial is undeclared: plateau_multigroup runs the birth spectrum from the
# derived plateau edge E_1 up to e*phi_c, and a stated fraction is refused.
none_valued = ["heating_anomalous_tail_phi_c_fraction"]


[models.neutral_closure]

# THE CLOSURE OF RECORD, adopted 2026-09-02. The neutral field is carried by
# the transient discrete-velocity model: a distribution f(z, v_z, v_perp) on
# the column and the annulus, advanced on its own clock, rather than by the
# two-moment fluid this stance ran until now. The selection is the first row;
# the other thirteen keys are what it FORCES, and they are written here at
# those required values rather than left to be resolved one refusal at a time.
#
# Everything below the selection says the same thing twice over: the DVM state
# OWNS the neutral first moment, so nothing else may carry a second copy of it
# or stand on one.
#
#   * neutral_momentum would evolve an M_n field that is already the first
#     moment of f;
#   * neutral_energy books the frictional half of the collisional exchange
#     against u - u_n, which has no meaning without that fluid wind, and the
#     hot internal wall and the hot birth drift are presence gates standing on
#     the hot channel neutral_energy creates;
#   * neutral_momentum_radial closes the RADIAL profile of the evolved wind,
#     so "uniform" is the only reading left;
#   * the four cathode-jet keys and the two anode-jet keys are M_n momentum
#     physics for the same reason. The recycle channels themselves are NOT
#     given up: the DVM's own cathode and anode jets carry them, armed in
#     [input_dict] above, and cathode_jet_energy_convention drops to "legacy"
#     because "total_reflected" rescales the FLUID jet's launch energy and
#     requires that fluid jet to exist;
#   * neutral_knudsen_temperature = "local" would scale the Knudsen
#     conductances by an evolved per-cell Tn, which only exists under
#     neutral_energy.
#
# The block therefore SUPERSEDES this file's former cathode_surface_recycle and
# anode_surface_recycle blocks: it claims seven of their eleven keys, and two
# blocks may not claim one key. The four it does not claim -- cathode_jet_R_N,
# cathode_jet_R_E, anode_jet_R_N, anode_jet_R_E -- are the fluid jets' surface
# pairs, inert with those jets off, and are left at their config defaults.
neutral_model = "kinetic_dvm"
neutral_momentum = false
neutral_energy = false
neutral_hot_internal_wall = false
neutral_hot_birth_drift = false
neutral_momentum_radial = "uniform"
neutral_knudsen_temperature = "frozen"
cathode_neutral_jet = false
cathode_jet_surface_debit = false
cathode_jet_energy_convention = "legacy"
cathode_jet_hot_carrier = false
anode_neutral_jet = false
neutral_mesh_accommodation = false

# The anode jet's energy convention is read against an anode jet that is off,
# and undeclared is the only value that stands without it.
none_valued = ["anode_jet_energy_convention"]


[models.initial_neutral_state]

# The equilibrate route is OFF and the profile route is armed: the equilibrated
# seed would overwrite the shaped foot, and the solver refuses the pair. The
# equilibration cycle count, its dt and the cached-seed modifier are config
# defaults, inert while the route is off, and are stated because a block is an
# inventory. equilibration_gas_puff_on_s is NOT inert -- the 27 ms puff window
# is a stance value the golden's own re-cut re-arms the route to use.
neutral_equilibration = false
launch_plasma_after_equilibration = true
neutral_equilibration_cycles = 100
neutral_equilibration_dt = 0.01
equilibration_gas_puff_on_s = 0.027
use_cached_neutral_seed = false

# INITIAL NEUTRAL FILL. Shaped foot profile, built by
# scripts/stance/sp3_build_nn0.py with NO kernel and NO foot argument -- so
# the builder supplies its own REGISTERED spreading member and this rung's
# own registered foot -- on an equilibrated base run of this stance at the
# 27 ms puff window declared above, with the tube-beamed puff row and the
# per-cell geometry profiles above. The fill is not an external file -- the
# arrays below ARE it, and they are where a reader reads its per-cell values.
# THE SPREADING MEMBER is the wall-limited Knudsen reference: a conservative
# finite-volume axial diffusion of the foot inventory away from the puff row,
