# g1atrim -- the LAPDSim1D stance of record.
#
# Stance   : g1atrim
# Adopted  : 2026-08-19
# Closure  : kinetic DVM (neutral_model = "kinetic_dvm"), since 2026-09-02
# Form     : declaration blocks, since 2026-08-30
#
# This file is the ONE artifact that constructs the stance, and it carries two
# kinds of table.
#
# ``[input_dict]`` and ``[input_flags]`` are the DELTA from ``default_config()``:
# every key in them differs from its config default, except cathode_emission_
# profile and Te_birth_ionization (resolved accretion) and Ti_birth_
# ionization (a class-1 declaration), which equal the default and are stated
# explicitly because run_m6_point.py's own driver defaults do not, or because
# the selection is physics-bearing.
#
# ``[models.<family>]`` blocks are INVENTORIES, not deltas: each states one
# model family's COMPLETE membership, every member written regardless of value,
# so the block reads as the whole decision and cannot go stale against a default
# that moves underneath it. Three families are declared here --
# neutral_closure, beam_tail_closure and initial_neutral_state.
#
# neutral_closure became DECLARABLE at the kinetic stance event (2026-09-02).
# A family with a selector may only be declared when that selector is at its
# engaging value, and this stance now runs neutral_model = "kinetic_dvm".
# Its fourteen members INCLUDE the four cathode-jet keys and the three
# anode-jet keys that the cathode_surface_recycle and anode_surface_recycle
# blocks used to declare, and two blocks may not claim one key -- so those two
# blocks are GONE from this file and the neutral_closure block below states
# each of those keys at the value the kinetic closure requires. The four keys
# they carried that neutral_closure does not own -- cathode_jet_R_N/R_E and
# anode_jet_R_N/R_E -- are the FLUID jets' surface pairs, inert while those
# jets are off, and they sit undeclared at their config defaults; the armed
# DVM jets read their own neutral_kinetic_dvm_{cathode,anode}_jet_R_N/_R_E
# pairs, which are the same numbers and are also config defaults.
#
# neutral_radial_closure stays UNDECLARABLE: its selector
# neutral_momentum_radial is "uniform", not the engaging "kinetic_two_moment".
# See cablp/solvers/_sim1d/CONFIG_DECLARATIONS.md for the form, its resolver
# and its refusals.
#
# Applying the two flat tables and the projected blocks on top of
# ``default_config()`` reproduces, key for key, the config the g1atrim arm of
# record ran.
#
# PROVENANCE IS NOT HERE. What each value is, how it was measured, derived,
# fitted or assumed, and what may be claimed from it live in
# scripts/stance/production_stance_provenance.md. This file carries values
# and the functional notes needed to read them.
#
# input_dict and input_flags are SEPARATE namespaces and each rejects a key it
# does not own, so a key in the wrong table raises at construction rather than
# going silently inert. The loader (scripts/stance/stance_config.py) checks
# both tables against the config templates before anything is constructed.
# A declaration block is written WITHOUT namespaces -- the family membership
# carries them -- so a member cannot be misfiled at all.
#
# TOML has no null literal: a member whose declared value is None is named in
# its own block's ``none_valued`` array instead of carrying a value.
#
# Consumers: ``run_m6_point.py --stance g1atrim`` (base config; --extra layers
# on top and says so), ``preflight_diffcfg.py --stance g1atrim`` (reference
# side of a config diff), and ``compare_sim1d_es1.PARAM_OVERRIDES`` (the shared
# driver values it carries are read from here, so they live in one place).
# A block is PROJECTED into the stance's own delta at load, so every one of
# those consumers reads ``Stance.params``/``.flags`` unchanged.


