# THE ENERGY-TIED LAUNCH SMEAR: the reference configuration with the surface
# jets' launch spectra smeared at a fixed FRACTION of their launch energy
# rather than at the local velocity-grid bin.
#
# A DERIVED configuration. It names its base and states what it moves, and
# nothing else: the measured machine, the operating point, the drive
# calibration, the neutral closure and the initial neutral state are all
# inherited, so this file cannot drift from the reference and a reader can see
# the whole difference between the two arms at a glance.
#
# WHAT IT IS FOR. The reference ties each jet's launch smear to the axial bin
# containing the launch speed, so the fractional energy width (3/2)T/e a launch
# is spread over is set by `neutral_kinetic_dvm_nvz` and halves with every
# doubling of it. The launched SHAPE is therefore a property of the velocity
# resolution rather than of the surface, and because the column-to-annulus
# escape is taken per velocity bin the source-region density follows the shape.
# This arm states the width as physics instead: 0.13 puts the fractional energy
# width at (3/2)(0.13) = 0.195, inside the Eckstein-class backscatter range,
# and holds it there at every launch energy and every nvz.
#
# WHY 0.13 AND NOT A NARROWER NUMBER. The grid-tied width remains a FLOOR --
# a smear narrower than the local bin collapses onto a single bin and cannot be
# projected at all -- so a beta far below the grid's own width would simply be
# floored everywhere and change nothing. 0.13 sits near the reference grid's
# own width at nvz = 64, which is what makes this arm and its nvz = 96 twin
# (`g1atrim_beta013_nvz96.toml`) the pair that measures whether the energy-tied
# form removes the resolution sensitivity.
#
# HOW TO RUN IT. The campaign drivers resolve `--stance <name>` against
# `scripts/stances/`, so copy this file there first; `run_sim1d.py` takes the
# path directly and needs no copy:
#
#     python scripts/run/run_sim1d.py \
#         --config scripts/stances/examples/g1atrim_beta013.toml \
#         --output g1atrim_beta013.h5
#
# The saved trajectory records the lineage -- this file's name, "g1atrim" as
# its base, both files' sha256, the delta key below, and the resolved
# configuration's identity -- so the arm is identifiable from its artifact
# alone. Its `dvm_transfer_ledger` census additionally carries
# `launch_floor_fraction`: the share of the run's launches that fell back on
# the grid-tied floor, i.e. how often the stated width was NOT in force.
base = "g1atrim"


[input_dict]
# The selection: smear every armed surface jet at T_launch = 0.13 * e_launch,
# floored at the local bin width. Both DVM jets the reference arms -- cathode
# and anode -- read this one key.
neutral_kinetic_dvm_jet_launch_width = 0.13
