# g1atrim_twin_half -- the PRODUCTION HALF COLUMN: the reference configuration
# cut at the mid-plane mirror face, started from its own shaped initial fill.
#
# A derived configuration: g1atrim plus only the keys this file moves. See
# cablp/solvers/_sim1d/CONFIG_DECLARATIONS.md ("Derived configurations -- a
# base and what it moves", and "The half column and its fill chain").
#
# THE GEOMETRY AND APPARATUS are the half-column base's
# (scripts/stances/examples/g1atrim_twin_half_base.toml), restated here by
# value: far_end = "mirror" ends the mesh at z = Lm/2 = 982.7 cm in a closed
# mirror face; nx = 118 gives a 129-cell mesh (1 plenum + 5 gap + 5 fixed
# source + 118 far column) with no end wall cell; S_pump_R is 0 because a half
# column has no end wall for the right pump; the walked anomalous tail
# constructs at a mirror only under the emission-fraction anode booking; and
# the two radius rows are the reference rows' own values on this mesh. The
# neutral baffle keys are the reference's own and are inherited.
#
# THE INITIAL NEUTRAL STATE takes the profile route, as the reference
# configuration does: the shaped foot below IS the initial fill, the 27 ms
# puff window is stated, the seed cache is off, and nn0 is null.
#
# THE FILL CHAIN. The rows are the output of
#   scripts/stance/sp3_build_nn0.py
#     --stance scripts/stances/examples/g1atrim_twin_half_base.toml
#     --sgp 9010 --base-from-h5 <base.h5>
# where <base.h5> is a run of that base configuration, whose equilibrate route
# (the puff/off accumulation at the 27 ms puff window) seeds the t = 0 frame
# the builder reads. The builder is given no kernel and no foot argument, so
# it applies its registered spreading member -- the wall-limited Knudsen
# reference, kappa = 2/3 in D_i = kappa R_i vbar, with the deposit released
# continuously over the foot -- at the registered foot, dt_foot = 5.88 ms, on
# this mesh. At the mirror face the spreading operator is zero-flux. The rows
# below are the builder's output at full repr precision.
base = "g1atrim"

