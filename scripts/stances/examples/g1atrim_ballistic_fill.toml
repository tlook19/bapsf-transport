# THE LEGACY BALLISTIC FILL: the reference configuration with its initial
# neutral fill spread by the legacy top-hat, as it was before the reference
# adopted the wall-limited Knudsen reference as the builder's registered
# spreading member.
#
# A DERIVED configuration. It names its base and states what it moves, and
# nothing else: the measured machine, the operating point, the drive
# calibration, the velocity mesh and the neutral closure are all inherited,
# so this file cannot drift from the reference and a reader can see the whole
# difference between the two arms at a glance.
#
# WHAT IT IS FOR. Every result produced before the reference moved carries
# these rows, so this file is what names that fill. A saved trajectory built
# from it records the lineage -- this file's name, "g1atrim" as its base, both
# files' sha256, the delta keys below and the resolved configuration's
# identity -- so an earlier arm's fill is nameable rather than describable.
#
# WHAT MOVES, AND WHAT DOES NOT. The foot inventory is the same 4.38e19 atoms
# at the same measured 5.83 ms foot on the same 27 ms equilibrated base; only
# WHERE that inventory lands moves. The legacy top-hat is a matrix kernel: a
# stencil in z, its targets weighted by cell LENGTH and its columns
# normalized, applied to an inventory deposited whole at the start of the
# foot, so it fills the interval the gas can free-stream to flatly and steps
# the added density by the area ratio at a bore change. The reference's member
# integrates a diffusion equation on the mesh's own zone VOLUMES with the
# deposit released continuously over the foot, so a source uniform per unit
# volume adds a density continuous across that step.
#
# THE ROWS THEMSELVES are also committed as
# scripts/data/nn0_legacy_ballistic_reference.npz, which carries the z grid
# they sit on and the builder arguments that reproduce them, and which
# scripts/verify/verify_fill_spreading.py's G0b leg checks at raw uint64.
#
# HOW TO RUN IT. The campaign drivers resolve `--stance <name>` against
# `scripts/stances/`, so copy this file there first; `run_sim1d.py` takes the
# path directly and needs no copy:
#
#     python scripts/run/run_sim1d.py \
#         --config scripts/stances/examples/g1atrim_ballistic_fill.toml \
#         --output g1atrim_ballistic_fill.h5
base = "g1atrim"


# THE INITIAL NEUTRAL STATE, restated whole. A declaration block is an
# INVENTORY of its family's complete membership, so every member is written
# out regardless of value; the two array rows are what this file moves, and
# the rest agree with the base because the two arms differ in the fill alone.
[models.initial_neutral_state]
neutral_equilibration = false
launch_plasma_after_equilibration = true
neutral_equilibration_cycles = 100
neutral_equilibration_dt = 0.01
equilibration_gas_puff_on_s = 0.027
use_cached_neutral_seed = false

neutral_initial_profile = true
