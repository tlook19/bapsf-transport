# g1atrim_twin_half_base -- the HALF-COLUMN BASE: the reference configuration
# cut at the mid-plane mirror face, with the equilibrate route that produces
# the equilibrated base run the half column's shaped initial fill is built on.
#
# A derived configuration: g1atrim plus only the keys this file moves. See
# cablp/solvers/_sim1d/CONFIG_DECLARATIONS.md ("Derived configurations -- a
# base and what it moves", and "The half column and its fill chain").
#
# THE GEOMETRY. far_end = "mirror" ends the mesh at z = Lm/2 in a closed
# mirror face, the symmetry plane of a two-source machine whose image source
# sits at z = Lm. Under it Lm is the mirror configuration's own length,
# cathode to image cathode: 1965.4 cm puts the plane at 982.7 cm, the
# magnet-array symmetry plane. nx counts the far column cells between the
# fixed source region and the plane; 118 keeps the far-column cell size within
# 0.5 % of the reference mesh's (7.453 cm against 7.488 cm). The mesh is 129 cells: 1 plenum + 5 gap + 5 fixed source + 118
# far column, with no end wall cell. A half column has no end wall for the
# right pump to sit on, so S_pump_R is 0 (the solver refuses anything else at
# a mirror). The walked anomalous tail constructs at a mirror only under the
# emission-fraction anode booking, so that selector moves with it.
#
# THE PER-CELL ROWS are the reference rows' own values over [0, Lm/2] on this
# mesh -- no re-fit and no new measurement. They are emitted by the reference
# configuration's two builders run with --stance naming this file:
# machine_radius_profile_cm by scripts/stance/g1_build_profiles.py (the bore
# staircase and the cathode-box stages, by cell centre) and
# plasma_radius_profile_cm by scripts/stance/build_msi_field_profile.py (the
# measured-field flux tube, whose flat hold reaches past this mesh's far end,
# so every cell is at the column radius 18.415 cm). Every entry equals the
# reference row's value in the reference cell containing this mesh's cell
# centre. The neutral baffle keys are the reference's own and are inherited.
#
# THE INITIAL NEUTRAL STATE. The reference's shaped fill rows are sized to
# its own mesh and cannot travel, so this file drops them and takes the
# equilibrate route: start_simulation() runs the puff/off accumulation at the
# reference's 27 ms puff window and seeds the plasma run's t = 0 frame from
# it. That t = 0 frame is the base scripts/stance/sp3_build_nn0.py
# --base-from-h5 reads, so a plasma run as short as the solver allows is
# enough; "equilibrate_only" would save the accumulation's own start frame at
# t = 0 instead. The seed cache stays off. nn0 is the direct-run fill the
# equilibrate route requires to be set; the equilibration does not read it.
base = "g1atrim"

[input_dict]
far_end = "mirror"
Lm = 1965.4
nx = 118
S_pump_R = 0.0
anode_tail_booking = "emission_fraction"
