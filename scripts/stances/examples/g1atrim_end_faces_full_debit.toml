# BOTH END FACES: the reference configuration with the machine's two axial end
# faces booking the electron energy their sheaths leave on the plasma.
#
# A DERIVED configuration. It names its base and states what it moves, and
# nothing else: the measured machine, the operating point, the drive
# calibration, the velocity mesh, the neutral closure and the initial neutral
# state are all inherited, so this file cannot drift from the reference and a
# reader can see the whole difference between the two arms at a glance.
#
# A PROBE, NOT A STANCE. The reference does not adopt this closure and this
# file is not a candidate for it: it exists so the A/B against the reference
# can be run at all. Nothing scored here transfers to the reference.
#
# WHAT IT IS FOR. The reference books the electrode electron sheath
# THERMAL-ONLY at both ends -- 2 Te per collected electron -- and leaves the
# fall on the electrode. That is right where a circuit supplies the field, and
# the anode already completes it under `anode_sheath_full_debit`; at the two
# axial ends it leaves two things unbooked. At the COLLECTOR there is no
# circuit branch at all, so the barrier its collected electrons climb is paid
# by the electron store itself and handed to the ions: the face debit is the
# sheath-edge (2 + Lambda_eff) Te per electron, not 2 Te. At the CATHODE the
# emitted electrons arrive carrying 2 k_B T_s plus whatever of the fall the
# beam row does not already distribute, and the returning plasma electrons
# climbed phi_c_plus to get there. This arm books all four rows and is the
# comparator that says what the two ends are worth TOGETHER.
#
# READ IT WITH THE ONE-KEY ARMS, NOT INSTEAD OF THEM. The two keys are
# independent and the faces are uncoupled except through the column, so a
# column-wide response on this arm is not attributable to either end on its
# own. `g1atrim_collector_sheath_full_debit.toml` and
# `g1atrim_cathode_face_full_debit.toml` are the arms that attribute it.
#
# WHAT IT DOES NOT CHANGE. No particle, momentum or ion-energy booking moves;
# the four rows are electron energy only. The beam deposition row is untouched
# (it already carries the net-phi_c energy of the emitted electrons). The
# circuit and the load ledger are untouched: the potentials those electrons
# ride are field energy the loop and the electrode ions already book.
#
# HOW TO RUN IT. The campaign drivers resolve `--stance <name>` against
# `scripts/stances/`, so copy this file there first; `run_sim1d.py` takes the
# path directly and needs no copy:
#
#     python scripts/run/run_sim1d.py \
#         --config scripts/stances/examples/g1atrim_end_faces_full_debit.toml \
#         --output g1atrim_end_faces_full_debit.h5
#
# The saved trajectory records the lineage -- this file's name, "g1atrim" as
# its base, both files' sha256, the delta keys below, and the resolved
# configuration's identity -- so the arm is identifiable from its artifact
# alone. Its `rhs_terms` carries the four rows this file arms, which the
# reference's does not carry at all; `scripts/score/power_ledger_sim1d.py`
# reports them per window and reads `n/a` on the reference side.
base = "g1atrim"


[input_flags]
# The selection, and the whole of it -- two keys, because the two faces arm
# independently. Arming refuses at construction unless the configuration
# supplies a collector-role plasma-absorbing face (the collector key), and the
# cathode circuit solve plus a cathode-adjacent plasma cell (the cathode key);
# the reference supplies all three.
collector_sheath_full_debit = true
cathode_face_full_debit = true
