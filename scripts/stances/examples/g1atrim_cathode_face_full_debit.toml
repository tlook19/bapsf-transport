# THE CATHODE END-FACE SHEATH DEBIT PROBE: the reference configuration with
# the machine's EMITTING end face booking the electron energy its sheath
# leaves on the plasma, and nothing else moved.
#
# A DERIVED configuration. It names its base and states what it moves, and
# nothing else: the measured machine, the operating point, the drive
# calibration, the velocity mesh, the neutral closure and the initial neutral
# state are all inherited, so this file cannot drift from the reference and a
# reader can see the whole difference between the two arms at a glance.
#
# A PROBE, NOT A STANCE. The reference does not adopt this closure and this
# file is not a candidate for it: it exists so the A/B against the reference
# can be run at all. Nothing scored here transfers to the reference.
#
# WHAT IT IS FOR. At the CATHODE the emitted electrons arrive carrying
# 2 k_B T_s plus whatever of the fall the beam row does not already
# distribute, and the returning plasma electrons climbed phi_c_plus to get
# there -- a heating channel and a cooling one whose net sign is a property of
# the state rather than a constant. Armed, all three are booked at the cathode
# cell as separate rows, because they are three physical channels with two
# signs and a single net would hide which one moved.
#
# WHY THE CATHODE ALONE. The two end faces carry different fluxes in different
# regimes -- the emitted-fall row is identically zero until a virtual cathode
# forms, while the collector's row is live in every phase -- and nothing
# couples them except the column. An arm that moves both cannot say which end
# a column-wide response came from; this file moves one.
#
# WHAT IT DOES NOT CHANGE. No particle, momentum or ion-energy booking moves;
# the three rows are electron energy only. The beam deposition row is
# untouched (it already carries the net-phi_c energy of the emitted
# electrons). The far end face is untouched -- that is
# `collector_sheath_full_debit`, a separate key. The circuit and the load
# ledger are untouched: the potentials those electrons ride are field energy
# the loop and the electrode ions already book.
#
# HOW TO RUN IT. The campaign drivers resolve `--stance <name>` against
# `scripts/stances/`, so copy this file there first; `run_sim1d.py` takes the
# path directly and needs no copy:
#
#     python scripts/run/run_sim1d.py \
#         --config scripts/stances/examples/g1atrim_cathode_face_full_debit.toml \
#         --output g1atrim_cathode_face_full_debit.h5
#
# The saved trajectory records the lineage -- this file's name, "g1atrim" as
# its base, both files' sha256, the delta key below, and the resolved
# configuration's identity -- so the arm is identifiable from its artifact
# alone. Its `rhs_terms` carries the three rows this file arms, which the
# reference's does not carry at all; `scripts/score/power_ledger_sim1d.py`
# reports them per window and notes the collector row as absent, which on this
# arm is by construction rather than an omission.
base = "g1atrim"


[input_flags]
# The selection, and the whole of it. Arming refuses at construction unless
# the configuration supplies the cathode circuit solve and a cathode-adjacent
# plasma cell; the reference supplies both.
cathode_face_full_debit = true
